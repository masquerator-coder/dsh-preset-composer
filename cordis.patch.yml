# dsh-preset-composer bundle layer.
#
# Applied when a profile lists this bundle (dsh plugin add dsh-preset-composer).
# The single row mounts the Host half (lib/index.mjs), which registers the
# `preset-composer` settings namespace and the `/preset-composer` slash command
# that edits preset files. There is deliberately no browser (client) half yet:
# DSH does not currently expose a client-bundle build channel for an out-of-tree
# plugin, so this package ships Host-only until that channel exists (the
# reserved client sources under src/client/ are not part of this build).
- insert:
    - id: preset-composer
      name: 'dsh-preset-composer'
